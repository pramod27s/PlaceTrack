spring.application.name=placetrack

# ---------------------------------------------------------------------------
# Database: PostgreSQL (Supabase), connected via the Session pooler.
#
# The password is loaded from application-secrets.properties (git-ignored).
# In a real deployment, set the DB_PASSWORD environment variable instead.
# ---------------------------------------------------------------------------
spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.aqehliqtdkiiojdbqhpe
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase's shared pooler caps connections — keep the local pool small.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# Hibernate creates/updates the schema on first run.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# JWT — override the secret in production via the JWT_SECRET env var.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:placetrack-local-dev-secret-key-please-override-in-prod-0123456789}
app.jwt.expiration-ms=604800000

# CORS — comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

server.port=8080
